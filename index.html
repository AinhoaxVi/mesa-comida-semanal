<style>

r{color:#a74231;background:#f8e9e4;box-shadow:none}.layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(255px,.8fr);gap:20px;padding-bottom:45px}.card{background:var(--white);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.week-card{padding:21px}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.card-head h2{font:700 18px system-ui,sans-serif;margin:0}.subtle{color:var(--muted);font-size:13px}.day{border-top:1px solid var(--line);padding:13px 0;display:grid;grid-template-columns:76px 1fr 1fr;gap:11px;align-items:start}.day-name{font-weight:700;font-size:13px;padding-top:9px}.meal{border-radius:13px;background:#f8f7f2;padding:10px 11px;min-height:74px;position:relative}.meal small{display:block;color:#748076;font-size:10px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;font-weight:700}.meal strong{font-size:13px;line-height:1.25;display:block;padding-right:18px}.meal .swap{position:absolute;right:9px;top:9px;border:0;background:transparent;color:#829086;font-size:16px;padding:0}.emptymeal{color:#98a19a;font-size:12px;padding:9px 0}.side{display:flex;flex-direction:column;gap:16px}.side-card{padding:19px}.side-card h3{font:700 16px system-ui,sans-serif;margin:0 0 14px}.stat{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.stat b{font-size:14px}.tip{background:#edf0e4;border-radius:14px;padding:14px;color:#455948;font-size:13px;line-height:1.5}.tip strong{display:block;margin-bottom:4px}.store-row{display:flex;align-items:center;gap:9px;margin:9px 0;font-size:13px}.store-dot{width:10px;height:10px;border-radius:50%;background:var(--green)}.store-dot.lidl{background:#3454a2}.store-dot.carrefour{background:#2374bd}.store-dot.mercadona{background:#76a94b}.hidden{display:none!important}.page{padding-bottom:55px}.list-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.list-group{margin:15px 0}.list-group h3{font:700 14px system-ui,sans-serif;margin:0 0 8px}.item{display:flex;align-items:center;gap:11px;background:var(--white);padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin:6px 0}.item input{accent-color:var(--green);width:17px;height:17px}.item.checked .itemname{text-decoration:line-through;color:#99a29b}.itemname{flex:1}.itemqty{color:var(--muted);font-size:12px}.item button{border:0;background:transparent;color:#9b6254;font-size:18px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #dcded4;border-radius:11px;padding:11px 12px;background:#fffefa;color:var(--ink);outline:none}.field textarea{min-height:72px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#6d9573;box-shadow:0 0 0 3px #6d95731b}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.checkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.checkpill{display:flex;gap:7px;align-items:center;background:#f7f6f0;border:1px solid var(--line);padding:10px;border-radius:11px;font-size:13px}.checkpill input{accent-color:var(--green)}.member{border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0;background:#faf9f5}.membertop{display:flex;justify-content:space-between;align-items:center;font-weight:700}.notice{padding:12px 14px;background:#fff5df;color:#765d2e;border-radius:12px;font-size:12px;line-height:1.5;margin:12px 0}.notice.green{background:#edf3e8;color:#405b43}.recipegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.recipe{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fffefa}.recipe h3{font:700 15px system-ui,sans-serif;margin:0 0 6px}.recipe p{color:var(--muted);font-size:12px;line-height:1.45;margin:0 0 12px}.tag{display:inline-block;background:#edf1e9;color:#49614b;border-radius:99px;padding:4px 8px;font-size:10px;margin:0 4px 6px 0}.modalback{position:fixed;inset:0;background:#15241ccc;display:grid;place-items:center;padding:18px;z-index:5}.modal{background:var(--paper);border-radius:20px;width:min(660px,100%);max-height:90vh;overflow:auto;padding:24px}.modalhead{display:flex;align-items:start;justify-content:space-between}.modalhead h2{font:800 23px system-ui,sans-serif;margin:0}.close{border:0;background:transparent;font-size:24px;color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#203d2b;color:white;padding:12px 18px;border-radius:99px;z-index:8;box-shadow:var(--shadow)}.empty{padding:34px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font:700 18px system-ui,sans-serif;margin-bottom:7px}.weeklabel{font-weight:700;font-size:13px}.footer{font-size:11px;color:#7f897f;text-align:center;padding:10px 0 30px}.mobileonly{display:none}
@media(max-width:760px){.shell{padding:0 15px}.top{height:66px}.top-right .welcome{display:none}.nav{overflow:auto;padding-top:12px}.nav button{white-space:nowrap;padding:9px 13px}.hero{align-items:start;gap:12px;flex-direction:column;padding-top:23px}.layout{grid-template-columns:1fr}.day{grid-template-columns:57px 1fr 1fr;gap:7px}.meal{padding:9px;min-height:79px}.meal strong{font-size:12px}.day-name{font-size:12px}.week-card{padding:15px}.recipegrid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.checkgrid{grid-template-columns:1fr 1fr}.mobileonly{display:inline}.top-right{gap:7px}}
@media(max-width:420px){.recipegrid{grid-template-columns:1fr}.day{grid-template-columns:47px 1fr 1fr}.checkgrid{grid-template-columns:1fr 1fr}.card-head{align-items:start;gap:7px;flex-direction:column}}

<body><div class="shell"><header class="top"><div class="brand"><span class="logo">✳</span>mesa<em>.</em></div><div class="top-right"><span class="welcome" id="welcome">Tu semana, más fácil</span><span class="avatar" id="avatar">M</span></div></header><nav class="nav" id="nav"><button class="active" data-page="week">Mi semana</button><button data-page="shopping">Lista de compra</button><button data-page="recipes">Platos</button><button data-page="profile">Mi perfil</button></nav><main id="app"></main><footer class="footer">Tus datos se guardan solo en este navegador · Mesa 0.1</footer></div><div id="modalroot"></div><div id="toastroot"></div>
<script>
const STORES=['Mercadona','Lidl','Carrefour','DIA','Alcampo','Consum'];
const ALLERGENS=['Gluten','Lácteos','Huevo','Frutos secos','Cacahuete','Pescado','Marisco','Soja','Sésamo'];
const INTOLERANCES=['Lactosa','Gluten','Fructosa','Histamina','Sulfitos'];
const seedRecipes=[
{id:'r1',name:'Pasta con tomate y albahaca',desc:'Rápida, rica y de las que salvan un martes.',time:20,allergens:['Gluten'],tags:['Fácil','Vegetariano'],ingredients:[['pasta',300,'g'],['tomate triturado',400,'g'],['cebolla',1,'ud'],['albahaca',1,'manojo'],['aceite de oliva',2,'cda']]},
{id:'r2',name:'Pollo al limón con patatas',desc:'Bandeja al horno y a otra cosa.',time:45,allergens:[],tags:['Horno','Sin gluten'],ingredients:[['pollo',600,'g'],['patata',700,'g'],['limón',1,'ud'],['ajo',2,'ud'],['aceite de oliva',2,'cda']]},
{id:'r3',name:'Tortilla de patata',desc:'Cena clásica. Con cebolla, que no somos animales.',time:35,allergens:['Huevo'],tags:['Vegetariano','Clásico'],ingredients:[['huevo',6,'ud'],['patata',600,'g'],['cebolla',1,'ud'],['aceite de oliva',3,'cda']]},
{id:'r4',name:'Arroz con verduras',desc:'Un plato completo con lo que tengas por la nevera.',time:30,allergens:[],tags:['Sin gluten','Vegetariano'],ingredients:[['arroz',300,'g'],['calabacín',1,'ud'],['pimiento',1,'ud'],['zanahoria',2,'ud'],['caldo de verduras',700,'ml']]},
{id:'r5',name:'Merluza con verduras',desc:'Suave y sencilla, lista en media hora.',time:25,allergens:['Pescado'],tags:['Ligero','Sin gluten'],ingredients:[['merluza',500,'g'],['calabacín',1,'ud'],['zanahoria',2,'ud'],['limón',1,'ud'],['aceite de oliva',1,'cda']]},
{id:'r6',name:'Lentejas estofadas',desc:'Deja para mañana y ya tienes comida resuelta.',time:55,allergens:[],tags:['Batch cooking','Vegano'],ingredients:[['lentejas',300,'g'],['zanahoria',2,'ud'],['patata',400,'g'],['cebolla',1,'ud'],['tomate triturado',200,'g']]},
{id:'r7',name:'Quesadillas de pollo',desc:'Para una cena sin complicarse la existencia.',time:20,allergens:['Gluten','Lácteos'],tags:['Rápido'],ingredients:[['tortillas de trigo',4,'ud'],['pollo',350,'g'],['queso rallado',150,'g'],['pimiento',1,'ud']]},
{id:'r8',name:'Crema de calabacín',desc:'Calentita, fácil y se congela estupendamente.',time:30,allergens:['Lácteos'],tags:['Vegetariano','Batch cooking'],ingredients:[['calabacín',3,'ud'],['patata',1,'ud'],['cebolla',1,'ud'],['leche',200,'ml']]},
{id:'r9',name:'Ensalada de garbanzos',desc:'Fresca y contundente. No, las ensaladas no son castigo.',time:15,allergens:[],tags:['Sin gluten','Vegano','Rápido'],ingredients:[['garbanzos cocidos',400,'g'],['tomate',2,'ud'],['pepino',1,'ud'],['cebolla',0.5,'ud'],['aceite de oliva',1,'cda']]},
{id:'r10',name:'Hamburguesas caseras',desc:'Con patatas al horno, planazo doméstico.',time:35,allergens:['Gluten'],tags:['Favorito'],ingredients:[['carne picada',500,'g'],['pan de hamburguesa',4,'ud'],['lechuga',1,'ud'],['tomate',1,'ud'],['patata',500,'g']]},
{id:'r11',name:'Salmón con arroz',desc:'Poco trabajo, plato resultón.',time:25,allergens:['Pescado'],tags:['Sin gluten'],ingredients:[['salmón',500,'g'],['arroz',250,'g'],['limón',1,'ud'],['brócoli',1,'ud']]},
{id:'r12',name:'Cuscús de verduras',desc:'Una comida colorida que se hace en un momento.',time:20,allergens:['Gluten'],tags:['Vegetariano','Rápido'],ingredients:[['cuscús',300,'g'],['calabacín',1,'ud'],['zanahoria',2,'ud'],['garbanzos cocidos',200,'g'],['caldo de verduras',300,'ml']]},
{id:'r13',name:'Macarrones con atún',desc:'El fondo de armario que nunca falla.',time:20,allergens:['Gluten','Pescado'],tags:['Rápido'],ingredients:[['pasta',300,'g'],['atún',2,'lata'],['tomate triturado',300,'g'],['cebolla',1,'ud']]},
{id:'r14',name:'Fajitas de verduras',desc:'Monta cada uno la suya y se acabó el debate.',time:25,allergens:['Gluten'],tags:['Vegetariano'],ingredients:[['tortillas de trigo',6,'ud'],['pimiento',2,'ud'],['cebolla',1,'ud'],['maíz',150,'g'],['aguacate',1,'ud']]},
{id:'r15',name:'Patatas con huevo',desc:'Cena apañada con ingredientes básicos.',time:30,allergens:['Huevo'],tags:['Sin gluten','Clásico'],ingredients:[['patata',600,'g'],['huevo',4,'ud'],['cebolla',1,'ud'],['aceite de oliva',2,'cda']]},
{id:'r16',name:'Albóndigas con tomate',desc:'Haz cantidad doble y congela una parte.',time:50,allergens:['Gluten','Huevo'],tags:['Batch cooking'],ingredients:[['carne picada',500,'g'],['huevo',1,'ud'],['pan rallado',50,'g'],['tomate triturado',500,'g'],['arroz',200,'g']]},
{id:'r17',name:'Bowl de arroz y aguacate',desc:'Fácil de adaptar a lo que haya por casa.',time:20,allergens:['Huevo'],tags:['Sin gluten','Vegetariano'],ingredients:[['arroz',250,'g'],['aguacate',1,'ud'],['maíz',100,'g'],['tomate',2,'ud'],['huevo',2,'ud']]},
{id:'r18',name:'Pizza casera',desc:'Noche de pizza. La masa comprada también cuenta.',time:30,allergens:['Gluten','Lácteos'],tags:['Favorito'],ingredients:[['masa de pizza',1,'ud'],['tomate triturado',150,'g'],['queso mozzarella',200,'g'],['champiñón',150,'g']]},
{id:'r19',name:'Salteado de arroz y pollo',desc:'Una sartén, un plato y cero drama.',time:25,allergens:['Soja','Gluten'],tags:['Rápido'],ingredients:[['arroz',250,'g'],['pollo',350,'g'],['zanahoria',1,'ud'],['guisantes',100,'g'],['salsa de soja',2,'cda']]},
{id:'r20',name:'Tomate, mozzarella y pan',desc:'Para esos días en los que cocinar es una sugerencia.',time:10,allergens:['Lácteos','Gluten'],tags:['Muy fácil'],ingredients:[['tomate',3,'ud'],['queso mozzarella',200,'g'],['pan',1,'ud'],['aceite de oliva',1,'cda']]}
];
const defaults={profile:null,recipes:seedRecipes,plan:{},pantry:[],extras:[],checked:[]};
let state=load();let page='week';
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem('mesaData')||'{}')}}catch{return {...defaults}}}
function save(){localStorage.setItem('mesaData',JSON.stringify(state));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){document.getElementById('toastroot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>document.getElementById('toastroot').innerHTML='',2200)}
function getWeek(){const d=new Date(),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return Array.from({length:7},(_,i)=>{let x=new Date(d);x.setDate(d.getDate()+i);return x})}
const dayNames=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];const mealNames={lunch:'Comida',dinner:'Cena'};
function normalized(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function blocked(r){const p=state.profile||{};const allergies=(p.allergies||[]).map(normalized),intolerances=(p.intolerances||[]).map(normalized),allergens=(r.allergens||[]).map(normalized);if(allergens.some(a=>allergies.includes(a)))return true;if(intolerances.includes('gluten')&&allergens.includes('gluten'))return true;if(intolerances.includes('lactosa')&&allergens.includes('lacteos'))return true;const dislikes=(p.dislikes||'').split(',').map(normalized).filter(Boolean);return (r.ingredients||[]).some(i=>dislikes.some(d=>normalized(i[0]).includes(d)))}
function serving(){return Math.max(1,Number(state.profile?.people)||2)}
function setup(){page='profile';render();toast('Completa el perfil para empezar')}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const p=state.profile;document.getElementById('welcome').textContent=p?.name?`Hola, ${p.name}`:'Tu semana, más fácil';document.getElementById('avatar').textContent=(p?.name||'M')[0].toUpperCase();if(!p&&page!=='profile'){document.getElementById('app').innerHTML=`<div class="empty card" style="margin:50px auto;max-width:580px"><b>Primero, cuéntame para quién cocinamos</b>Completa el perfil del hogar para adaptar el menú y las listas a vosotros.<p><button class="btn" onclick="setup()">Crear perfil</button></p></div>`;return}if(page==='week')renderWeek();if(page==='shopping')renderShopping();if(page==='recipes')renderRecipes();if(page==='profile')renderProfile()}
function renderWeek(){const dates=getWeek();let html=`<section class="hero"><div><div class="eyebrow">Semana del ${dates[0].toLocaleDateString('es-ES',{day:'numeric',month:'long'})}</div><h1>¿Qué comemos?</h1><p>Un menú apañado para ${serving()} ${serving()===1?'persona':'personas'}.</p></div><button class="btn" onclick="generatePlan()">✳ Crear menú</button></section><section class="layout"><div class="card week-card"><div class="card-head"><h2>Tu menú de la semana</h2><span class="weeklabel">Comidas y cenas</span></div>${dates.map((d,i)=>`<div class="day"><div class="day-name">${dayNames[i]}<div class="subtle">${d.getDate()}/${d.getMonth()+1}</div></div>${['lunch','dinner'].map(m=>{const id=state.plan[`${i}-${m}`],r=state.recipes.find(x=>x.id===id);return r?`<div class="meal"><small>${mealNames[m]}</small><strong>${esc(r.name)}</strong><button class="swap" title="Cambiar plato" onclick="chooseMeal(${i},'${m}')">↻</button></div>`:`<div class="meal" onclick="chooseMeal(${i},'${m}')"><small>${mealNames[m]}</small><span class="emptymeal">+ Añadir plato</span></div>`}).join('')}</div>`).join('')}<div style="display:flex;justify-content:end;padding-top:12px"><button class="btn secondary small" onclick="go('shopping')">Preparar lista de compra →</button></div></div><aside class="side"><div class="card side-card"><h3>La semana en números</h3><div class="stat"><span>Platos planificados</span><b>${Object.keys(state.plan).length} / 14</b></div><div class="stat"><span>Personas</span><b>${serving()}</b></div><div class="stat"><span>Supermercado principal</span><b>${esc(pickStore())}</b></div></div><div class="tip"><strong>✦ Un truco de Mesa</strong>Planifica una receta doble y deja una ración congelada. El “no tengo nada” del jueves pierde fuerza.</div><div class="card side-card"><h3>Tiendas guardadas</h3>${(state.profile?.stores||[]).map(s=>`<div class="store-row"><span class="store-dot ${normalized(s)}"></span>${esc(s)}</div>`).join('')||'<span class="subtle">Añádelas en tu perfil.</span>'}</div></aside></section>`;document.getElementById('app').innerHTML=html}
function pickStore(){return state.profile?.stores?.[0]||'Sin elegir'}
function generatePlan(){const available=state.recipes.filter(r=>!blocked(r));if(!available.length){toast('No hay platos compatibles: revisa las restricciones');return}const plan={};const recent=[];for(let i=0;i<7;i++)for(const m of ['lunch','dinner']){let options=available.filter(r=>!recent.slice(-3).includes(r.id));if(!options.length)options=available;const r=options[Math.floor(Math.random()*options.length)];plan[`${i}-${m}`]=r.id;recent.push(r.id)}state.plan=plan;state.checked=[];save();toast('Menú semanal creado')}
function chooseMeal(day,meal){const choices=state.recipes.filter(r=>!blocked(r));const root=document.getElementById('modalroot');root.innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><div><div class="eyebrow">${dayNames[day]} · ${mealNames[meal]}</div><h2>Elige un plato</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="recipegrid" style="margin-top:18px">${choices.map(r=>`<article class="recipe"><h3>${esc(r.name)}</h3><p>${esc(r.desc)}</p><button class="btn secondary small" onclick="setMeal(${day},'${meal}','${r.id}')">Añadir</button></article>`).join('')}</div><p><button class="btn ghost small" onclick="go('recipes');closeModal()">Crear un plato propio</button></p></div></div>`}
function setMeal(day,meal,id){state.plan[`${day}-${meal}`]=id;closeModal();save();toast('Plato añadido')}
function closeModal(){document.getElementById('modalroot').innerHTML=''}
function go(p){page=p;render();window.scrollTo(0,0)}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function shopItems(){const acc={};for(const id of Object.values(state.plan)){const r=state.recipes.find(x=>x.id===id);if(!r)continue;(r.ingredients||[]).forEach(([n,q,u])=>{const key=normalized(n)+'|'+u;if(!acc[key])acc[key]={name:n,qty:0,unit:u};acc[key].qty+=q*serving()/2})}const pantry=(state.pantry||[]).map(x=>normalized(x.name));Object.values(acc).forEach(a=>{if(pantry.includes(normalized(a.name)))a.have=true});(state.extras||[]).forEach(x=>{const key='extra-'+x.id;acc[key]={name:x.name,qty:x.qty||1,unit:x.unit||'ud',extra:true}});return Object.values(acc)}
const productStore={'pasta':['Mercadona','Lidl','Carrefour','DIA','Alcampo','Consum'],'pollo':['Mercadona','Lidl','Carrefour','DIA','Alcampo','Consum'],'patata':['Mercadona','Lidl','Carrefour','DIA','Alcampo','Consum'],'huevo':['Mercadona','Lidl','Carrefour','DIA','Alcampo','Consum'],'arroz':['Mercadona','Lidl','Carrefour','DIA','Alcampo','Consum'],'leche':['Mercadona','Lidl','Carrefour','DIA','Alcampo','Consum'],'tomate':['Mercadona','Lidl','Carrefour','DIA','Alcampo','Consum'],'aceite de oliva':['Mercadona','Lidl','Carrefour','DIA','Alcampo','Consum'],'garbanzos cocidos':['Mercadona','Lidl','Carrefour','DIA','Alcampo','Consum'],'merluza':['Mercadona','Carrefour','Alcampo','Consum'],'salmón':['Mercadona','Lidl','Carrefour','Alcampo'],'queso rallado':['Mercadona','Lidl','Carrefour','DIA','Alcampo','Consum'],'tortillas de trigo':['Mercadona','Lidl','Carrefour','DIA','Alcampo'],'masa de pizza':['Mercadona','Lidl','Carrefour','DIA','Alcampo']};
function renderShopping(){const items=shopItems();const store=pickStore();const groups={};items.forEach((it,i)=>{if(it.have)return;const category=it.extra?'Añadidos':categoryFor(it.name);(groups[category]??=[]).push({...it,index:i})});const grouped=Object.entries(groups);document.getElementById('app').innerHTML=`<section class="hero"><div><div class="eyebrow">Compra semanal · ${esc(store)}</div><h1>La lista, hecha</h1><p>${items.filter(x=>!x.have).length} productos según tu menú, para ${serving()} ${serving()===1?'persona':'personas'}.</p></div><div class="list-tools"><button class="btn secondary" onclick="openExtra()">＋ Añadir producto</button><button class="btn ghost" onclick="clearChecked()">Limpiar marcados</button></div></section>${!Object.keys(state.plan).length?`<div class="card empty"><b>Aún no hay menú para calcular</b>Primero crea tu menú semanal.<p><button class="btn" onclick="go('week')">Ir al menú</button></p></div>`:`<div class="notice green">✦ La cantidad se calcula para ${serving()} personas. Los productos del catálogo son referencias básicas: revisa el formato y la etiqueta en tu tienda.</div><section style="max-width:780px">${grouped.map(([cat,arr])=>`<div class="list-group"><h3>${esc(cat)}</h3>${arr.map(it=>{const key=it.name+'|'+it.unit;const checked=state.checked.includes(key);const stores=productStore[normalized(it.name)]||[];return `<label class="item ${checked?'checked':''}"><input type="checkbox" ${checked?'checked':''} onchange="toggleChecked(${esc(JSON.stringify(key))})"><span class="itemname">${esc(it.name)}<span class="subtle" style="display:block;font-size:10px;margin-top:3px">${stores.includes(store)?`Referencia básica para ${esc(store)}`:'Comprueba disponibilidad en tienda'}</span></span><span class="itemqty">${formatQty(it.qty)} ${esc(it.unit)}</span>${it.extra?`<button onclick="removeExtra('${it.id}');event.preventDefault()" title="Quitar">×</button>`:''}</label>`}).join('')}</div>`).join('')}<div class="card side-card"><h3>Ya tengo en casa</h3><div class="subtle">Estos ingredientes se descuentan de la lista.</div><div style="display:flex;gap:8px;margin-top:10px"><input id="pantryInput" placeholder="Ej. arroz" class="field" style="margin:0;flex:1"><button class="btn secondary small" onclick="addPantry()">Añadir</button></div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">${state.pantry.map(x=>`<span class="tag">${esc(x.name)} <button style="border:0;background:none;color:#8c5144" onclick="removePantry('${x.id}')">×</button></span>`).join('')}</div></div></section>`}`}
function categoryFor(n){const x=normalized(n);if(/pollo|carne|merluza|salmon|atun|huevo/.test(x))return 'Carne, pescado y huevos';if(/leche|queso|mozzarella/.test(x))return 'Lácteos';if(/patata|cebolla|tomate|calabacin|pimiento|zanahoria|limon|albahaca|pepino|lechuga|brocoli|aguacate|champi|guisante/.test(x))return 'Fruta y verdura';if(/pasta|arroz|cuscus|pan|tortilla|masa|lenteja|garbanzo|tomate triturado|caldo|maiz|aceite/.test(x))return 'Despensa';return 'Otros'}
function formatQty(q){return Math.round(q*10)/10}
function toggleChecked(n){state.checked.includes(n)?state.checked=state.checked.filter(x=>x!==n):state.checked.push(n);save()}
function clearChecked(){state.checked=[];save();toast('Lista despejada')}
function addPantry(){const input=document.getElementById('pantryInput'),name=input.value.trim();if(!name)return;state.pantry.push({id:crypto.randomUUID(),name});save();toast('Añadido a la despensa')}
function removePantry(id){state.pantry=state.pantry.filter(x=>x.id!==id);save()}
function openExtra(){document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:450px"><div class="modalhead"><h2>Añadir a la compra</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Producto</label><input id="extraName" placeholder="Ej. café"></div><div class="formgrid"><div class="field"><label>Cantidad</label><input type="number" min="0.1" step="0.1" value="1" id="extraQty"></div><div class="field"><label>Unidad</label><select id="extraUnit"><option>ud</option><option>kg</option><option>g</option><option>l</option><option>pack</option></select></div></div><button class="btn" onclick="addExtra()">Añadir producto</button></div></div>`}
function addExtra(){const name=document.getElementById('extraName').value.trim();if(!name){toast('Escribe un producto');return}state.extras.push({id:crypto.randomUUID(),name,qty:Number(document.getElementById('extraQty').value)||1,unit:document.getElementById('extraUnit').value});closeModal();save();toast('Añadido a la lista')}
function removeExtra(id){state.extras=state.extras.filter(x=>x.id!==id);save()}
function renderRecipes(){const safe=state.recipes.filter(r=>!blocked(r));document.getElementById('app').innerHTML=`<section class="hero"><div><div class="eyebrow">Recetario</div><h1>Platos para la semana</h1><p>${safe.length} opciones compatibles con el perfil del hogar.</p></div><button class="btn" onclick="openRecipe()">＋ Crear plato</button></section><div class="notice">Las sugerencias excluyen alérgenos conocidos, gluten, lactosa y alimentos que no gustan. Otras sensibilidades requieren revisar cada plato y sus ingredientes. Comprueba etiquetas y trazas.</div><div class="recipegrid">${safe.map(r=>`<article class="recipe"><h3>${esc(r.name)}</h3><p>${esc(r.desc)} · ${Number(r.time)||25} min</p><div>${(r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="subtle" style="font-size:11px;margin:5px 0 12px">${(r.ingredients||[]).map(i=>esc(i[0])).join(' · ')}</div><button class="btn secondary small" onclick="addRecipeToWeek('${r.id}')">Planificar</button>${r.custom?` <button class="btn ghost small" onclick="deleteRecipe('${r.id}')">Eliminar</button>`:''}</article>`).join('')}</div>`}
function openRecipe(){document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><div><div class="eyebrow">Tu recetario</div><h2>Crear plato propio</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Nombre del plato</label><input id="rName" placeholder="Ej. arroz de la abuela"></div><div class="field"><label>Descripción breve</label><input id="rDesc" placeholder="Qué lleva o por qué os gusta"></div><div class="formgrid"><div class="field"><label>Ingredientes <span class="subtle">uno por línea: ingrediente | cantidad | unidad</span></label><textarea id="rIngredients" placeholder="arroz | 300 | g&#10;pollo | 400 | g&#10;pimiento | 1 | ud"></textarea></div><div class="field"><label>Alérgenos conocidos</label><select id="rAllergens" multiple size="4">${ALLERGENS.map(a=>`<option>${a}</option>`).join('')}</select></div></div><div class="field"><label>Tiempo aproximado (min)</label><input id="rTime" type="number" value="25"></div><button class="btn" onclick="saveRecipe()">Guardar plato</button></div></div>`}
function saveRecipe(){const name=document.getElementById('rName').value.trim();if(!name){toast('Ponle un nombre al plato');return}const ingredients=document.getElementById('rIngredients').value.split('\n').map(line=>line.split('|').map(x=>x.trim())).filter(parts=>parts[0]).map(([n,q,u])=>[n,Number(q)||1,u||'ud']);const allergens=[...document.getElementById('rAllergens').selectedOptions].map(x=>x.value);state.recipes.push({id:'c'+crypto.randomUUID(),name,desc:document.getElementById('rDesc').value.trim(),time:Number(document.getElementById('rTime').value)||25,ingredients,allergens,tags:['Personalizado'],custom:true});closeModal();save();toast('Plato guardado')}
function addRecipeToWeek(id){const empty=Array.from({length:14},(_,i)=>{const day=Math.floor(i/2),meal=i%2?'dinner':'lunch';return [`${day}-${meal}`,state.plan[`${day}-${meal}`]]}).find(x=>!x[1]);if(empty){state.plan[empty[0]]=id;save();toast('Añadido al menú')}else{go('week');toast('El menú está completo: toca ↻ para cambiar un plato')}}
function deleteRecipe(id){state.recipes=state.recipes.filter(x=>x.id!==id);Object.keys(state.plan).forEach(k=>{if(state.plan[k]===id)delete state.plan[k]});save()}
function renderProfile(){const p=state.profile||{name:'',people:2,members:[],allergies:[],intolerances:[],dislikes:'',stores:['Mercadona'],budget:'',note:''};const members=p.members?.length?p.members:Array.from({length:Number(p.people)||1},(_,i)=>({name:i===0?'Persona 1':`Persona ${i+1}`,type:'Adulto'}));document.getElementById('app').innerHTML=`<section class="hero"><div><div class="eyebrow">Ajustes del hogar</div><h1>¿Para quién cocinamos?</h1><p>Usaremos esto para filtrar platos y calcular las cantidades.</p></div></section><section class="card side-card" style="max-width:780px;margin-bottom:40px"><div class="formgrid"><div class="field"><label>Cómo te llamas</label><input id="pName" value="${esc(p.name)}" placeholder="Tu nombre"></div><div class="field"><label>Personas en casa</label><input id="pPeople" type="number" min="1" max="12" value="${esc(p.people)}" onchange="updateMembers()"></div></div><div class="field"><label>Personas</label><div id="members">${members.map((m,i)=>memberMarkup(m,i)).join('')}</div></div><div class="field"><label>Alergias <span class="subtle">exclusiones estrictas</span></label><div class="checkgrid">${ALLERGENS.map(a=>`<label class="checkpill"><input type="checkbox" name="allergy" value="${esc(a)}" ${(p.allergies||[]).includes(a)?'checked':''}>${esc(a)}</label>`).join('')}</div></div><div class="field"><label>Intolerancias y sensibilidades</label><div class="checkgrid">${INTOLERANCES.map(a=>`<label class="checkpill"><input type="checkbox" name="intolerance" value="${esc(a)}" ${(p.intolerances||[]).includes(a)?'checked':''}>${esc(a)}</label>`).join('')}</div></div><div class="field"><label>Alimentos que no os gustan <span class="subtle">separados por comas</span></label><input id="pDislikes" value="${esc(p.dislikes)}" placeholder="Ej. champiñón, cilantro"></div><div class="field"><label>Supermercados habituales</label><div class="checkgrid">${STORES.map(a=>`<label class="checkpill"><input type="checkbox" name="store" value="${esc(a)}" ${(p.stores||[]).includes(a)?'checked':''}>${esc(a)}</label>`).join('')}</div><span class="subtle">El primero marcado será el principal.</span></div><div class="formgrid"><div class="field"><label>Presupuesto semanal orientativo</label><select id="pBudget"><option value="" ${!p.budget?'selected':''}>Sin indicar</option><option ${p.budget==='40'?'selected':''}>40</option><option ${p.budget==='60'?'selected':''}>60</option><option ${p.budget==='80'?'selected':''}>80</option><option ${p.budget==='100'?'selected':''}>100</option></select></div><div class="field"><label>Nota para las sugerencias</label><input id="pNote" value="${esc(p.note)}" placeholder="Ej. cenas rápidas entre semana"></div></div><div class="notice">Los filtros automáticos cubren los alérgenos indicados y las intolerancias a gluten y lactosa. Fructosa, histamina y sulfitos quedan registrados para consulta, pero requieren revisión manual. Comprueba siempre etiquetas, trazas y conservación.</div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn" onclick="saveProfile()">Guardar perfil</button><button class="btn ghost" onclick="exportData()">Exportar mis datos</button><button class="btn danger small" onclick="resetData()">Borrar datos del dispositivo</button></div></section>`}
function memberMarkup(m,i){return `<div class="member"><div class="membertop"><span>Persona ${i+1}</span></div><div class="formgrid"><div class="field"><label>Nombre o apodo</label><input class="membername" value="${esc(m.name||'')}" placeholder="Opcional"></div><div class="field"><label>Perfil</label><select class="membertype"><option ${m.type==='Adulto'?'selected':''}>Adulto</option><option ${m.type==='Niño/a'?'selected':''}>Niño/a</option></select></div></div></div>`}
function updateMembers(){const count=Math.max(1,Math.min(12,Number(document.getElementById('pPeople').value)||1));const prev=[...document.querySelectorAll('.member')].map(x=>({name:x.querySelector('.membername').value,type:x.querySelector('.membertype').value}));document.getElementById('members').innerHTML=Array.from({length:count},(_,i)=>memberMarkup(prev[i]||{name:`Persona ${i+1}`,type:'Adulto'},i)).join('')}
function saveProfile(){const members=[...document.querySelectorAll('.member')].map(x=>({name:x.querySelector('.membername').value.trim(),type:x.querySelector('.membertype').value}));const stores=[...document.querySelectorAll('input[name="store"]:checked')].map(x=>x.value);if(!stores.length){toast('Elige al menos un supermercado');return}state.profile={name:document.getElementById('pName').value.trim(),people:members.length,members,allergies:[...document.querySelectorAll('input[name="allergy"]:checked')].map(x=>x.value),intolerances:[...document.querySelectorAll('input[name="intolerance"]:checked')].map(x=>x.value),dislikes:document.getElementById('pDislikes').value,stores,budget:document.getElementById('pBudget').value,note:document.getElementById('pNote').value};page='week';save();toast('Perfil guardado')}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mesa-datos.json';a.click();URL.revokeObjectURL(a.href);toast('Copia descargada')}
function resetData(){if(confirm('¿Borrar el perfil, menú, despensa y platos guardados de este navegador?')){localStorage.removeItem('mesaData');state=load();page='profile';render();toast('Datos borrados')}}
render();
</script></body></html>
