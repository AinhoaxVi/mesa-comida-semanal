<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087c80">
  <meta name="description" content="Menú, compra y tareas del hogar compartidas.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css?v=20261014-products">
  <title>Casa a Punto</title>
</head>
<body>
  <div id="app" class="shell">
    <header class="top">
      <div class="brand"><span class="mark" aria-hidden="true">🏠</span><span>casa a punto<small id="house-name">Nuestro hogar</small></span></div>
      <button id="bell" class="icon-button" aria-label="Notificaciones" hidden>🔔<span id="unread"></span></button>
    </header>
    <div id="account-bar" class="account-bar" hidden><span id="account-name"></span><button id="signout" class="text-button">Salir</button></div>
    <main id="view" aria-live="polite"></main>
    <nav id="nav" class="navigation" aria-label="Secciones" hidden>
      <button data-page="today"><span>🏠</span>Hoy</button>
      <button data-page="menu"><span>🍽️</span>Menú</button>
      <button data-page="shopping"><span>🛒</span>Compra</button>
      <button data-page="home"><span>🧺</span>Casa</button>
      <button data-page="settings"><span>⚙️</span>Ajustes</button>
    </nav>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="config.js?v=20261014-products" defer></script>
  <script src="catalog.js?v=20261014-products" defer></script>
  <script src="app.js?v=20261014-products" defer></script>
